<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>GeoCam</title>
<meta name="theme-color" content="#0B0E11" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- ===================== Caméra ===================== -->
  <video id="video" autoplay playsinline muted></video>
  <canvas id="captureCanvas"></canvas>

  <!-- ===================== Boussole (haut droite) ===================== -->
  <div class="top-bar">
    <div class="camera-switch-badge hidden" id="cameraSwitchBtn" aria-label="Changer de caméra">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#E8E6E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l4 4-4 4" />
        <path d="M3 12v-2a4 4 0 0 1 4-4h14" />
        <path d="M7 22l-4-4 4-4" />
        <path d="M21 12v2a4 4 0 0 1-4 4H3" />
      </svg>
    </div>
    <div class="compass-col">
      <div class="compass-wrap">
        <svg id="compassDial" class="compass-dial" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="47" fill="rgba(11,14,17,0.72)" stroke="rgba(232,230,225,0.25)" stroke-width="1.5"/>
          <!-- graduations tous les 30° -->
          <g id="ticks" stroke="#4FD1C5" stroke-width="1.6"></g>
          <!-- lettres cardinales -->
          <text x="50" y="14" text-anchor="middle" fill="#FF8A00" font-size="11" font-weight="700" font-family="ui-monospace,monospace">N</text>
          <text x="88" y="53.5" text-anchor="middle" fill="#E8E6E1" font-size="9" font-family="ui-monospace,monospace">E</text>
          <text x="50" y="92" text-anchor="middle" fill="#E8E6E1" font-size="9" font-family="ui-monospace,monospace">S</text>
          <text x="12" y="53.5" text-anchor="middle" fill="#E8E6E1" font-size="9" font-family="ui-monospace,monospace">O</text>
        </svg>
        <div class="compass-pointer"></div>
      </div>
      <div class="heading-readout">
        <span class="cardinal" id="cardinalVal">--</span> <span id="headingVal">---°</span>
      </div>
    </div>
  </div>

  <!-- ===================== Toast ===================== -->
  <div class="toast" id="toast"></div>

  <!-- ===================== Bas d'écran : bouton + minimap, puis tableau de coordonnées ===================== -->
  <div class="bottom-area">
    <div class="shutter-row">
      <button id="shutterBtn" aria-label="Prendre la photo"></button>
      <div class="minimap-wrap">
        <div id="minimap"></div>
        <div class="fov-cone" id="fovCone"></div>
        <div class="user-dot"></div>
        <div class="minimap-north">N</div>
      </div>
    </div>
    <div class="coords-table">
      <div class="row"><span class="label">X (LV95)</span><span class="value" id="xVal">--</span></div>
      <div class="row"><span class="label">LAT</span><span class="value" id="latVal">--</span></div>
      <div class="row"><span class="label">Y (LV95)</span><span class="value" id="yVal">--</span></div>
      <div class="row"><span class="label">LON</span><span class="value" id="lonVal">--</span></div>
      <div class="row"><span class="label">ALT (Bessel)</span><span class="value" id="altBesselVal">--</span></div>
      <div class="row"><span class="label">PRÉC.</span><span class="value" id="accVal">--</span></div>
    </div>
  </div>

  <!-- ===================== Écran de permissions ===================== -->
  <div class="gate" id="gate">
    <img src="icons/icon-192.png" alt="GeoCam" />
    <h1>GeoCam</h1>
    <p>Autorise la caméra, la position et les capteurs d'orientation pour afficher la boussole, la minimap et les coordonnées sur tes photos.</p>
    <button id="startBtn">Activer l'appareil</button>
    <p class="error hidden" id="gateError"></p>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4@2.9.2/dist/proj4.js"></script>
<script src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
